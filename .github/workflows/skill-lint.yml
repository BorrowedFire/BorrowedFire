name: skill-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint skills
        run: bash tools/skill-lint.sh
      - name: Syntax-check shell scripts
        run: |
          for script in install.sh tools/skill-lint.sh tools/bf-local-agent-remote tools/install-local-agent-worker docker/codex-local/agent-entrypoint; do
            bash -n "$script"
          done
      - name: shellcheck
        run: shellcheck install.sh tools/skill-lint.sh tools/bf-local-agent-remote tools/install-local-agent-worker docker/codex-local/agent-entrypoint tests/test-install.sh tests/test-brain.sh
      - name: Routing policy tests
        run: python3 tests/test-route.py
      - name: Installer test matrix (sandbox HOME)
        run: bash tests/test-install.sh
      - name: Brain protocol live proof (two clones, bare remote)
        run: bash tests/test-brain.sh
